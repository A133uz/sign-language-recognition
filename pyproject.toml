[project]
name = "sign-language-recognition"
version = "0.1.0"
description = "ASL Citizen dataset setup and live MediaPipe hand tracking"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==1.26.4",
    "opencv-contrib-python>=4.10,<4.12",
    "mediapipe==1.2.2",
]

[project.optional-dependencies]
cpu = ["torch==2.11.0", "torchvision==0.26.0"]
cuda = ["torch==2.11.0", "torchvision==0.26.0"]
training = [
    "scikit-learn>=1.7,<2",
]

[tool.uv]
package = false
required-version = "==0.13.5"
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cuda" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
